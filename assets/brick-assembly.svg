    <path d="M8 48 44 30 88 52 52 70Z" fill="#60a5fa"/>
    <path d="M8 48 52 70V88L8 66Z" fill="#2563eb"/>
    <path d="M52 70 88 52V70L52 88Z" fill="#1e40af"/>
    <g fill="#3b82f6" stroke="#1d4ed8" stroke-width="1">
      <path d="M26 52v4a6 3 0 0 0 12 0v-4Z"/>
      <path d="M42 60v4a6 3 0 0 0 12 0v-4Z"/>
    </g>
    <g fill="#93c5fd">
